[package]
name = "otter"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros"] }
blurhash = "0.2.3"
deadpool-redis = "0.23.0"
dotenvy = "0.15.7"
fastembed = "5.13.4"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.11.0"
opentelemetry = { version = "0.32.0", features = ["trace", "logs", "metrics"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["trace", "logs", "metrics", "http-proto"] }
opentelemetry_sdk = { version = "0.32.0", features = ["trace", "logs", "metrics", "rt-tokio"] }
pgvector = { version = "0.4.1", features = ["sqlx"] }
redis = { version = "1.2.0", features = ["tokio-comp"] }
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["json", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0", features = ["macros", "postgres", "runtime-tokio", "time"] }
time = "0.3.47"
tokio = { version = "1.52.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tower-http = { version = "0.7.0", features = ["trace", "cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
utoipa = { version = "5.4.0", features = ["macros"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
utoipa-ts = "0.1.3"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
