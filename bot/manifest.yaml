display_information:
  name: Otter
  description: Browse submitted projects inside Slack.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: Otter
    always_online: true
  slash_commands:
    - command: /otter
      description: List a user's projects projects.
      usage_hint: "[@user]"
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - users:read
      - users.profile:read
      - chat:write
      - chat:write.customize
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
